<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sustainability Project Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
        }
        .btn-primary {
            @apply bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg transition;
        }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-md border-b-4 border-emerald-600">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="/" class="flex items-center space-x-2 text-2xl font-bold text-emerald-600">
                    <i class="fas fa-leaf"></i>
                    <span>DUT Sustainability</span>
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="/dashboard" class="text-gray-700 hover:text-emerald-600 flex items-center space-x-1">
                        <i class="fas fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="/submit-project" class="text-gray-700 hover:text-emerald-600 flex items-center space-x-1">
                        <i class="fas fa-plus-circle"></i>
                        <span>Submit</span>
                    </a>
                    <a href="/admin/pending" class="text-gray-700 hover:text-emerald-600 flex items-center space-x-1">
                        <i class="fas fa-cog"></i>
                        <span>Admin</span>
                    </a>
                    <a href="/notifications" class="text-gray-700 hover:text-emerald-600 flex items-center space-x-1">
                        <i class="fas fa-bell"></i>
                        <span>Notifications</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-900 text-gray-300 py-8 mt-16">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2026 DUT Sustainability Office | Aligned with ENVISION2030</p>
            <div class="flex justify-center space-x-4 mt-4">
                <a href="#" class="hover:text-emerald-400"><i class="fab fa-facebook"></i></a>
                <a href="#" class="hover:text-emerald-400"><i class="fab fa-twitter"></i></a>
                <a href="#" class="hover:text-emerald-400"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
